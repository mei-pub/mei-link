name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.1.0）"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Tauri 桌面客户端（macOS / Windows / Linux 并行）
  # -----------------------------------------------------------------------
  tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            label: windows-amd64
            rust_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: linux-amd64
            rust_target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: cross-platform-client/go.sum

      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend deps
        working-directory: cross-platform-client/desktop
        run: npm install

      - name: Build Tauri desktop client
        shell: bash
        run: bash Scripts/build-desktop.sh --copy

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: meilink-desktop-${{ matrix.label }}
          path: release/meilink-desktop-*

  # -----------------------------------------------------------------------
  # Job 2: Swift 原生客户端（仅 macOS）
  # -----------------------------------------------------------------------
  swift-native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go (for go-cross-compile of frpc if needed later)
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: cross-platform-client/go.sum

      - name: Build Swift binary via SwiftPM
        shell: bash
        run: |
          swift build -c release
          echo "✓ Swift binary built"

      - name: Package Swift .app + DMG
        shell: bash
        run: |
          VERSION="1.1.0"
          PREBUILT_APP="build/Meilink.app"
          if [ ! -d "$PREBUILT_APP" ]; then
            echo "! build/Meilink.app missing (need pre-built bundle in repo)"
            exit 1
          fi
          # Inject fresh Swift binary into the pre-built .app bundle
          cp .build/release/Meilink "$PREBUILT_APP/Contents/MacOS/Meilink"
          # Bump version in plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
            "$PREBUILT_APP/Contents/Info.plist" 2>/dev/null || true
          # Build DMG
          mkdir -p release
          STAGE="/tmp/dmg-staging-$$"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$PREBUILT_APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Meilink" -srcfolder "$STAGE" \
            -ov -fs HFS+ -format UDZO "release/meilink-${VERSION}-macOS-native.dmg" >/dev/null 2>&1
          rm -rf "$STAGE"
          echo "✓ Swift native DMG built"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: meilink-swift-native
          path: release/meilink-1.1.0-macOS-native.dmg

  # -----------------------------------------------------------------------
  # Job 3: 服务端 setup 工具（Linux amd64 + arm64 交叉编译，任意平台可跑）
  # -----------------------------------------------------------------------
  server-setup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: cross-platform-client/go.sum

      - name: Build setup tool
        shell: bash
        run: |
          cd cross-platform-client
          VERSION="1.1.0"
          mkdir -p "$GITHUB_WORKSPACE/release"
          for goarch in amd64 arm64; do
            outname="meilink-setup-${VERSION}-linux-${goarch}"
            stagedir="/tmp/$outname"
            rm -rf "$stagedir" && mkdir -p "$stagedir"
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" \
              go build -ldflags "-s -w" -o "$stagedir/meilink-setup" ./cmd/meilink-setup
            tar -czf "$GITHUB_WORKSPACE/release/${outname}.tar.gz" -C /tmp "$outname"
            echo "✓ ${outname}.tar.gz"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: meilink-server-setup
          path: release/meilink-setup-*

  # -----------------------------------------------------------------------
  # Job 4: 汇总所有产物到 Release
  # -----------------------------------------------------------------------
  publish-release:
    needs: [tauri-desktop, swift-native, server-setup]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Organize release files
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Meilink ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: release/*
