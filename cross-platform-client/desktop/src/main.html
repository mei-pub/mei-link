<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles/app.css">
<style>
  .app { display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo { width: 36px; height: 36px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .header-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--text-secondary); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .status-indicator { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,0.04); font-size: 12px; min-width: 100px; }
  .divider { height: 1px; background: var(--border); }
  .tunnel-list { flex: 1; overflow-y: auto; padding: 0 16px; }
  .list-header { display: flex; font-size: 11px; color: var(--text-secondary); padding: 6px 0; border-bottom: 1px solid var(--border); font-weight: 500; }
  .col-name { width: 130px; } .col-local { width: 110px; } .col-route { flex: 1; } .col-status { width: 70px; }
  .tunnel-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); gap: 10px; }
  .tunnel-item .col-name { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; color: var(--text); }
  .tunnel-item .col-local { font-size: 11px; color: var(--text-secondary); }
  .tunnel-item .col-local .type { font-size: 10px; color: var(--text-secondary); font-weight: 600; display: block; }
  .tunnel-item .col-route { font-size: 11px; color: var(--text); }
  .tunnel-item .col-route .err { color: var(--danger); font-size: 10px; }
  .tunnel-item .col-route .sub { color: var(--text-secondary); font-size: 10px; }
  .tunnel-item .col-actions { display: flex; gap: 3px; }
  .icon-btn { background: none; border: none; color: var(--text-secondary); padding: 4px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(0,0,0,0.06); color: var(--text); }
  .footer { display: flex; align-items: center; padding: 10px 16px; gap: 8px; }
  .footer .count { font-size: 11px; color: var(--text-secondary); flex: 1; }
  .menu-wrap { position: relative; }
  .dropdown { position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 3px; min-width: 130px; z-index: 10; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .dropdown.show { display: block; }
  .dropdown-item { padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px; color: var(--text); }
  .dropdown-item:hover { background: var(--surface); }
  .dropdown-item.danger { color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="header-logo" id="appLogo" style="background:none"></div>
      <div>
        <div class="header-title">Meilink</div>
        <div id="serverSummary" class="header-sub">尚未配置服务器</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-indicator"><span class="status-dot stopped"></span><span id="statusText">未配置</span></div>
      <button id="connBtn" class="btn btn-sm" aria-label="连接" title="连接"></button>
      <button id="restartBtn" class="btn btn-sm" aria-label="重启" title="重启"></button>
      <button id="settingsBtn" class="btn btn-sm" aria-label="设置" title="设置"></button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="tunnel-list">
    <div class="list-header">
      <div class="col-name">名称</div><div class="col-local">本地</div><div class="col-route">外网访问</div><div style="width:80px"></div><div class="col-status">状态</div><div style="width:120px"></div>
    </div>
    <div id="tunnelRows"></div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div id="emptyIcon" style="margin-bottom:10px;display:flex;justify-content:center;color:var(--text-tertiary)"></div>
      <h3 style="font-size:14px;font-weight:600;color:var(--text)">还没有隧道</h3>
      <p style="margin-top:4px;font-size:11px">添加一个 HTTP、HTTPS、TCP 或 UDP 隧道，把本机服务发布出去。</p>
      <button class="btn btn-primary btn-sm" style="margin-top:12px" id="emptyAdd"></button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="footer">
    <button class="btn btn-sm" id="addBtn" aria-label="添加隧道" title="添加隧道"></button>
    <span id="tunnelCount" class="count">0/0 个隧道启用</span>
    <button class="btn btn-sm" id="logsBtn" aria-label="查看日志" title="查看日志"></button>
    <button class="btn btn-sm" id="clearLogBtn" aria-label="清空日志" title="清空日志">清空日志</button>
  </div>
</div>

<script type="module">
import { api, openWindow, closeWindow, openUrl, copyText, overallStatus, routeText, canOpen, STATUS_LABELS, esc, tunnelStatus } from "./lib/api.js";
import { icons } from "./lib/icons.js";
import { customAlert, customConfirm } from "./lib/dialog.js";

document.getElementById("appLogo").innerHTML = '<img src="/icons/app-icon.png" width="36" height="36" style="border-radius:8px;object-fit:contain">';
document.getElementById("connBtn").innerHTML = icons.play + " 连接";
document.getElementById("restartBtn").innerHTML = icons.restart + " 重启";
document.getElementById("settingsBtn").innerHTML = icons.settings;
document.getElementById("addBtn").innerHTML = icons.plus + " 添加隧道";
document.getElementById("logsBtn").innerHTML = icons.log + " 查看日志";
document.getElementById("clearLogBtn").textContent = "清空日志";
document.getElementById("emptyAdd").innerHTML = icons.plus + " 添加隧道";
document.getElementById("emptyAdd").onclick = () => { sessionStorage.removeItem("editTunnelId"); openWindow("tunnel-edit"); };

document.getElementById("connBtn").onclick = async () => {
  const btn = document.getElementById("connBtn");
  btn.disabled = true;
  try {
    const s = await api.getStatus();
    btn.innerHTML = s.running ? icons.stop + " 断开中..." : icons.play + " 连接中...";
    if (s.running) await api.stop(); else await api.start();
  } catch(e) {
    customAlert("连接控制失败: " + e.message);
  } finally {
    btn.disabled = false;
    refresh();
  }
};
document.getElementById("restartBtn").onclick = async () => {
  const btn = document.getElementById("restartBtn");
  btn.disabled = true;
  btn.innerHTML = icons.restart + " 重启中...";
  try {
    await api.restart();
  } catch(e) {
    customAlert("重启失败: " + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = icons.restart + " 重启";
    refresh();
  }
};
document.getElementById("settingsBtn").onclick = () => openWindow("settings");
document.getElementById("addBtn").onclick = () => { sessionStorage.removeItem("editTunnelId"); openWindow("tunnel-edit"); };
document.getElementById("logsBtn").onclick = () => openWindow("logs");
document.getElementById("clearLogBtn").onclick = async () => { await api.clearEvents(); };

async function refresh() {
  try {
    const [status, config, tunnels] = await Promise.all([api.getStatus(), api.getServerConfig().catch(()=>null), api.getTunnels()]);
    const ov = overallStatus(status);
    document.getElementById("statusText").textContent = ov.text;
    document.querySelector("#statusText").parentElement.querySelector(".status-dot").className = "status-dot " + ov.dotClass;
    const sub = config ? `${config.serverAddr}:${config.serverPort} · ${config.subDomainHost||""}` : "尚未配置服务器";
    document.getElementById("serverSummary").textContent = sub;
    const connBtn = document.getElementById("connBtn");
    connBtn.innerHTML = (status.running ? icons.stop : icons.play) + (status.running ? " 断开" : " 连接");
    connBtn.setAttribute("aria-label", status.running ? "断开" : "连接");
    connBtn.title = status.running ? "断开" : "连接";
    connBtn.className = "btn btn-sm " + (status.running ? "btn-danger" : "");
    connBtn.disabled = !status.configured;

    const rows = document.getElementById("tunnelRows");
    const empty = document.getElementById("emptyState");
    if (tunnels.length === 0) {
      rows.innerHTML = ""; empty.style.display = "block";
      document.getElementById("emptyIcon").innerHTML = icons.plus;
    } else {
      empty.style.display = "none";
      rows.innerHTML = tunnels.map(t => {
        const st = tunnelStatus(t);
        const route = routeText(t, config);
        const localAddr = `${t.localIP||"127.0.0.1"}:${t.localPort}`;
        const dotClass = st==='running'?'running':(st==='closed'||st==='new'||st==='start_error'||st==='check_failed'?'stopped':'connecting');
        return `<div class="tunnel-item">
          <div class="col-name"><span class="status-dot ${dotClass}" style="width:7px;height:7px"></span>${esc(t.name)}</div>
          <div class="col-local"><span class="type">${(t.type||"").toUpperCase()}</span>${esc(localAddr)}</div>
          <div class="col-route">${esc(route)}${t.errorMessage?`<div class="err">${esc(t.errorMessage)}</div>`:`<div class="sub">${esc(route)}</div>`}</div>
          <div class="col-actions" style="width:80px">
            <button class="icon-btn" title="复制" data-copy="${esc(route)}">${icons.copy}</button>
            ${canOpen(t) ? `<button class="icon-btn" title="打开" data-open="${esc(route)}">${icons.external}</button>` : ""}
          </div>
          <div class="col-status"><span class="t-status ${st}">${STATUS_LABELS[st]||st}</span></div>
          <div class="col-actions" style="width:120px;justify-content:flex-end">
            <label class="toggle"><input type="checkbox" ${t.enabled?"checked":""} data-toggle="${t.id}"><span class="slider"></span></label>
            <div class="menu-wrap"><button class="icon-btn" data-menu="${t.id}">${icons.more}</button></div>
          </div>
        </div>`;
      }).join("");
      rows.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy));
      rows.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openUrl(b.dataset.open));
      rows.querySelectorAll("[data-toggle]").forEach(cb => cb.onchange = () => api.toggleTunnel(cb.dataset.toggle, cb.checked).then(refresh));
      rows.querySelectorAll("[data-menu]").forEach(b => b.onclick = (e) => { e.stopPropagation(); showMenu(b.dataset.menu, b.parentElement); });
    }
    const enabled = tunnels.filter(t => t.enabled).length;
    document.getElementById("tunnelCount").textContent = `${enabled}/${tunnels.length} 个隧道启用`;
  } catch(e) { console.error(e); }
}

function showMenu(id, container) {
  const existing = document.querySelector(".dropdown.show");
  if (existing) { existing.remove(); return; }
  const dd = document.createElement("div");
  dd.className = "dropdown show";
  dd.innerHTML = `<div class="dropdown-item" data-edit="${id}">${icons.settings} 编辑</div><div class="dropdown-item danger" data-del="${id}">${icons.trash} 删除</div>`;
  container.appendChild(dd);
  dd.querySelector("[data-edit]").onclick = () => { sessionStorage.setItem("editTunnelId", id); openWindow("tunnel-edit"); dd.remove(); };
  dd.querySelector("[data-del]").onclick = async () => { if (await customConfirm("删除隧道", "确定删除此隧道？删除后无法恢复。", { confirmText: "删除", danger: true })) { await api.deleteTunnel(id); refresh(); } dd.remove(); };
}
document.addEventListener("click", () => { const d = document.querySelector(".dropdown.show"); if (d) d.remove(); });

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
