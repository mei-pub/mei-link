<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meilink</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;line-height:1.4}*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}.shell{max-width:1180px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e4e9f2;border-radius:14px;box-shadow:0 12px 30px #1720330b}.login{max-width:410px;margin:13vh auto;padding:32px}.brand{display:flex;align-items:center;gap:12px}.mark{display:block;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#236cec,#66a3ff);box-shadow:0 7px 15px #246fec3d}.brand h1{font-size:22px;line-height:1.15;margin:0}.muted{color:#718198;font-size:13px}.notice{min-height:19px;color:#c33535;font-size:13px}.topbar{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.status{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px}.dot{width:9px;height:9px;border-radius:50%;background:#98a6ba}.dot.ok{background:#20a36b}.dot.warn{background:#e7a22d}.button{border:0;border-radius:8px;min-height:38px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;background:#2877f5;color:#fff}.button.secondary{background:#edf3fd;color:#2b61ad}.button.danger{background:#fdeaea;color:#b73737}.button.ghost{background:#fff;color:#527092;border:1px solid #dbe4f2}.button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:8px;align-items:center}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel h2{font-size:16px;margin:0}.tunnel-list{border:1px solid #e8edf5;border-radius:10px;overflow:hidden}.tunnel-head,.tunnel{display:grid;grid-template-columns:minmax(150px,1.05fr) minmax(130px,.8fr) minmax(170px,1.35fr) minmax(92px,.7fr) auto;gap:14px;align-items:center}.tunnel-head{padding:10px 14px;background:#f8faff;color:#758399;font-size:12px}.tunnel{padding:14px;border-top:1px solid #edf1f6}.tunnel:first-child{border-top:0}.tunnel-name{font-weight:650}.tunnel-local,.tunnel-route{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tunnel-route a{color:#286fda;text-decoration:none}.type{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:99px;background:#eef4ff;color:#3567af;font-size:11px;font-weight:600}.state{font-size:12px;font-weight:600;color:#7e8ca0}.state.running{color:#219468}.state.wait-start{color:#c98917}.state.start-error,.state.check-failed{color:#c03434}.state.closed,.state.new{color:#7e8ca0}.error{color:#c33535;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.row-actions{justify-content:flex-end;white-space:nowrap}.icon-button{width:32px;min-height:32px;padding:0;border-radius:7px}.empty{padding:42px 20px;text-align:center;color:#718198;font-size:13px}.logs{max-height:330px;overflow:auto;background:#111827;color:#cbd5e1;border-radius:9px;padding:12px;font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap}.settings{margin-top:16px}.settings summary{cursor:pointer;color:#486b93;font-size:13px}.settings form{padding-top:16px}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}.field label{font-size:12px;color:#607087}.form-row{display:flex;gap:10px}.form-row>.field{flex:1}input,select{height:39px;width:100%;border:1px solid #dce4ef;border-radius:8px;padding:0 10px;background:#fff;color:#172033;font:inherit}input:focus,select:focus{outline:2px solid #2877f533;border-color:#2877f5}.dialog{width:min(660px,calc(100vw - 28px));padding:0;border:0;border-radius:14px;box-shadow:0 25px 70px #17203342}.dialog::backdrop{background:#17203370}.dialog-head,.dialog-foot{padding:18px 22px;display:flex;align-items:center;justify-content:space-between}.dialog-head{border-bottom:1px solid #e8edf5}.dialog-head h2{margin:0;font-size:18px}.dialog form{padding:20px 22px}.dialog-foot{border-top:1px solid #e8edf5;justify-content:flex-end}.dialog .actions{justify-content:flex-end}.toast{position:fixed;right:22px;bottom:22px;max-width:min(420px,calc(100vw - 44px));padding:11px 14px;background:#172033;color:#fff;border-radius:9px;box-shadow:0 10px 24px #1720333d;font-size:13px}.toast.error{background:#b63838}@media(max-width:850px){.layout{grid-template-columns:1fr}.tunnel-head{display:none}.tunnel{grid-template-columns:1fr auto}.tunnel-local,.tunnel-route,.state{grid-column:1}.row-actions{grid-column:2;grid-row:1/5;flex-direction:column}.topbar{align-items:flex-start;gap:12px;flex-direction:column}}@media(max-width:560px){.shell{margin:14px auto;padding:0 12px}.topbar,.panel{padding:16px}.form-row{flex-direction:column;gap:0}.actions{flex-wrap:wrap}.button{flex:1}.tunnel{gap:7px}}
  </style>
</head>
<body>
  <main id="loginView" class="card login">
    <div class="brand"><i class="mark"></i><div><h1>Meilink</h1><div class="muted">NAS 隧道管理</div></div></div>
    <form id="loginForm">
      <div class="field" style="margin-top:26px"><label>账号</label><input name="user" value="admin" required autocomplete="username"></div>
      <div class="field"><label>密码</label><input name="password" type="password" required autocomplete="current-password"></div>
      <p id="loginError" class="notice"></p><button class="button" style="width:100%">登录</button>
    </form>
  </main>

  <main id="appView" class="shell hidden">
    <header class="card topbar">
      <div class="brand"><i class="mark"></i><div><h1>Meilink</h1><div class="status"><i id="statusDot" class="dot"></i><span id="statusText">正在读取状态</span></div></div></div>
      <div class="actions"><button id="startButton" class="button">连接</button><button id="restartButton" class="button secondary">重启</button><button id="stopButton" class="button secondary">断开</button><button id="logoutButton" class="button ghost">退出</button></div>
    </header>

    <div class="layout">
      <section class="card panel">
        <div class="panel-head"><div><h2>隧道</h2><div id="tunnelSummary" class="muted">正在读取</div></div><button id="newTunnelButton" class="button">＋ 添加隧道</button></div>
        <div id="tunnelList" class="tunnel-list"></div>
      </section>
      <section class="card panel"><div class="panel-head"><h2>运行日志</h2><button id="refreshButton" class="button ghost">刷新</button></div><div id="events" class="logs">尚无日志</div></section>
    </div>

    <section class="card panel settings"><details><summary>服务器连接设置</summary><form id="configForm">
      <div class="form-row"><div class="field"><label>服务器地址</label><input name="serverAddr" required placeholder="frp.example.com"></div><div class="field"><label>服务器端口</label><input name="serverPort" type="number" value="7000" required></div></div>
      <div class="form-row"><div class="field"><label>认证 Token</label><input name="authToken" type="password" placeholder="已保存时留空不修改"></div><div class="field"><label>子域名根域</label><input name="subDomainHost" placeholder="example.com"></div></div>
      <div class="form-row"><div class="field"><label>Admin 端口</label><input name="adminPort" type="number" value="7400" required></div><div class="field"><label>Admin 用户</label><input name="adminUser" value="admin" required></div><div class="field"><label>Admin 密码</label><input name="adminPassword" type="password" placeholder="已保存时留空不修改"></div></div>
      <label class="muted"><input type="checkbox" name="tlsEnabled" checked> 启用 TLS</label><div class="actions" style="margin-top:12px"><button class="button">保存设置</button></div>
    </form></details></section>
  </main>

  <dialog id="tunnelDialog" class="dialog" aria-label="编辑隧道">
    <div class="dialog-head"><h2 id="tunnelDialogTitle">添加隧道</h2><button id="closeTunnelDialog" class="button ghost icon-button" aria-label="关闭">×</button></div>
    <form id="tunnelForm">
      <input type="hidden" name="id">
      <div class="form-row"><div class="field"><label>隧道名称</label><input name="name" required placeholder="photo" pattern="[A-Za-z0-9][A-Za-z0-9_.-]*"></div><div class="field"><label>类型</label><select name="type"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="tcp">TCP</option><option value="udp">UDP</option></select></div></div>
      <div class="form-row"><div class="field"><label>本地地址</label><input name="localIP" value="127.0.0.1" required></div><div class="field"><label>本地端口</label><input name="localPort" type="number" min="1" max="65535" required></div></div>
      <div id="webTunnelFields"><div class="form-row"><div class="field"><label>子域名</label><input name="subdomain" placeholder="photo 或 photo.example.com"></div><div class="field"><label>自定义域名</label><input name="customDomains" placeholder="多个域名用逗号分隔"></div></div><div class="form-row"><div class="field"><label>HTTP 用户名</label><input name="httpUser"></div><div class="field"><label>HTTP 密码</label><input name="httpPassword" type="password"></div></div><div class="field"><label>Host Header Rewrite</label><input name="hostHeaderRewrite" placeholder="可选"></div></div>
      <div id="portTunnelFields" class="field hidden"><label>远程端口</label><input name="remotePort" type="number" min="1" max="65535" placeholder="留空自动分配"></div>
      <div class="field"><label class="muted"><input name="enabled" type="checkbox" checked> 创建后立即启用</label></div>
      <div class="dialog-foot"><div class="actions"><button id="cancelTunnelButton" type="button" class="button ghost">取消</button><button id="saveTunnelButton" class="button">保存</button></div></div>
    </form>
  </dialog>
  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
