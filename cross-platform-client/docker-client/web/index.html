<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meilink</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:32px auto;padding:0 20px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:14px;box-shadow:0 10px 28px #1720330d}.login{max-width:420px;margin:13vh auto;padding:32px}.brand{display:flex;align-items:center;gap:12px}.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2877f5,#60a5fa);box-shadow:0 5px 14px #2877f544}.brand h1{font-size:22px;margin:0}.muted{color:#708096;font-size:13px}.notice{min-height:18px;color:#c03232;font-size:13px}.topbar{padding:17px 22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.status{display:flex;align-items:center;gap:8px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.dot.ok{background:#20a36b}.dot.warn{background:#e9a12a}.button{border:0;border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer;background:#2877f5;color:#fff}.button.secondary{background:#eef3fb;color:#2a5eae}.button.danger{background:#fce9e9;color:#b33d3d}.button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel{padding:20px}.panel h2{font-size:16px;margin:0 0 16px}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}.field label{font-size:12px;color:#607087}.row{display:flex;gap:10px}.row>.field{flex:1}input,select{height:38px;border:1px solid #dce3ee;border-radius:8px;padding:0 10px;color:#182235;background:#fff;font:inherit}input:focus,select:focus{outline:2px solid #2877f533;border-color:#2877f5}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}.tunnel-list{padding:0;overflow:hidden}.tunnel{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 20px;border-top:1px solid #edf0f5}.tunnel:first-child{border-top:0}.tunnel-name{font-weight:600}.pill{font-size:11px;border-radius:99px;padding:3px 7px;background:#eff5ff;color:#3769b4;margin-left:7px}.empty{padding:24px 20px;color:#708096;font-size:13px}.logs{max-height:260px;overflow:auto;background:#111827;color:#cbd5e1;border-radius:9px;padding:12px;font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap}.settings{margin-top:16px}.settings summary{cursor:pointer;color:#42678f;font-size:13px}.settings form{padding-top:16px}.hidden{display:none}@media(max-width:760px){.shell{margin:16px auto}.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:12px;flex-direction:column}.row{flex-direction:column}.actions{justify-content:stretch}.actions .button{flex:1}}
</style></head><body>
<main id="loginView" class="card login"><div class="brand"><i class="mark"></i><div><h1>Meilink</h1><div class="muted">NAS 隧道管理</div></div></div><form id="loginForm"><div class="field" style="margin-top:26px"><label>账号</label><input name="user" value="admin" required autocomplete="username"></div><div class="field"><label>密码</label><input name="password" type="password" required autocomplete="current-password"></div><p id="loginError" class="notice"></p><button class="button" style="width:100%">登录</button></form></main>
<main id="appView" class="shell hidden"><header class="card topbar"><div class="brand"><i class="mark"></i><div><h1>Meilink</h1><div class="status"><i id="statusDot" class="dot"></i><span id="statusText">正在读取状态</span></div></div></div><div class="actions"><button id="startButton" class="button">连接</button><button id="stopButton" class="button secondary">断开</button><button id="logoutButton" class="button secondary">退出</button></div></header>
<div class="grid"><section class="card panel"><h2>隧道</h2><form id="tunnelForm"><div class="row"><div class="field"><label>名称</label><input name="name" required placeholder="photo"></div><div class="field"><label>类型</label><select name="type"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="tcp">TCP</option><option value="udp">UDP</option></select></div></div><div class="row"><div class="field"><label>本地地址</label><input name="localIP" value="127.0.0.1" required></div><div class="field"><label>本地端口</label><input name="localPort" type="number" min="1" max="65535" required></div></div><div class="row"><div class="field"><label>子域名（HTTP/HTTPS）</label><input name="subdomain" placeholder="photo.example.com"></div><div class="field"><label>远程端口（TCP/UDP）</label><input name="remotePort" type="number" min="1" max="65535"></div></div><div class="actions"><button class="button">添加隧道</button></div></form><div id="tunnelList" class="tunnel-list"></div></section>
<section class="card panel"><h2>运行日志</h2><div id="events" class="logs">尚无日志</div></section></div>
<section class="card panel settings"><details><summary>服务器连接设置</summary><form id="configForm"><div class="row"><div class="field"><label>服务器地址</label><input name="serverAddr" required placeholder="frp.example.com"></div><div class="field"><label>服务器端口</label><input name="serverPort" type="number" value="7000" required></div></div><div class="row"><div class="field"><label>认证 Token</label><input name="authToken" type="password" placeholder="已保存时留空不修改"></div><div class="field"><label>子域名根域</label><input name="subDomainHost" placeholder="example.com"></div></div><div class="row"><div class="field"><label>Admin 端口</label><input name="adminPort" type="number" value="7400" required></div><div class="field"><label>Admin 用户</label><input name="adminUser" value="admin" required></div><div class="field"><label>Admin 密码</label><input name="adminPassword" type="password" placeholder="已保存时留空不修改"></div></div><label class="muted"><input type="checkbox" name="tlsEnabled" checked> 启用 TLS</label><div class="actions"><button class="button">保存设置</button></div></form></details></section>
</main><script type="module" src="/app.js"></script></body></html>
