<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meilink</title><style>body{margin:0;background:#f6f7fb;color:#1f2937;font:14px system-ui}.card{max-width:960px;margin:48px auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;box-shadow:0 8px 24px #0001}input,button{padding:10px;border:1px solid #d1d5db;border-radius:7px}button{background:#2563eb;color:white;cursor:pointer}.row{display:flex;gap:8px;align-items:center;margin:12px 0}.muted{color:#6b7280}#app{display:none}</style><body><main class="card" id="login"><h1>Meilink</h1><p class="muted">NAS 隧道管理</p><div class="row"><input id="user" value="admin" placeholder="账号"><input id="pass" type="password" placeholder="密码"><button onclick="login()">登录</button></div><p id="error"></p></main><main class="card" id="app"><div class="row"><h1>Meilink</h1><span id="status" class="muted"></span><button onclick="call('/api/control/start')">连接</button><button onclick="call('/api/control/stop')">断开</button></div><h2>隧道</h2><pre id="tunnels"></pre><h2>日志</h2><pre id="events"></pre></main><script type="module" src="/app.js"></script></body></html>
