name: Meilink
options:
  bundleIdPrefix: pub.mei.meilink
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  Meilink:
    type: application
    platform: macOS
    sources:
      - client/macos-native
    info:
      path: client/macos-native/Info.plist
      properties:
        CFBundleName: Meilink
        CFBundleDisplayName: Meilink
        CFBundleIdentifier: pub.mei.meilink
        CFBundleIconFile: AppIcon
        CFBundleVersion: "1.0"
        CFBundleShortVersionString: "1.0.0"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSMainStoryboardFile: ""
    settings:
      base:
        PRODUCT_NAME: Meilink
        INFOPLIST_FILE: client/macos-native/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    preBuildScripts:
      - name: Download frpc
        script: |
          bash "${SRCROOT}/scripts/assets/download-frpc.sh"
        runOnlyWhenInstalling: false
