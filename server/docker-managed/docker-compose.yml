# =============================================================================
# Meilink Server（frps + Web 管理页一体镜像）
#
# 默认使用 host 网络模式：容器直接复用宿主机网络栈，管理页改 frps 端口后
# 立即生效，无需重建容器。frps 监听的 7000/8080/8443 和管理页 17500 直接
# 暴露在宿主机上，请用防火墙/安全组控制访问。
#
# 部署：
#   docker compose up -d          # 构建镜像 + 启动
#   docker compose logs -f        # 看日志
#   docker compose build && docker compose up -d   # 改完代码或环境变量后重建
#
# 安全提醒（host 模式）：
#   - 管理页 17500 默认对公网开放，**务必**把 ADMIN_PASSWORD 改成强密码
#     （建议 openssl rand -base64 24）。
#   - 如需限制管理页访问，用 ufw/iptables 给 17500 加 IP 白名单。
#   - 宿主机 7000/8080/8443/17500 不能被其他进程占用。
# =============================================================================
services:
  meilink-server:
    image: meilink-server:latest
    build: .
    container_name: meilink-server
    restart: unless-stopped
    network_mode: host          # 直接用宿主机网络栈，不要写 ports
    environment:
      # ---- 必填 ----
      MEILINK_ADMIN_USER: admin
      MEILINK_ADMIN_PASSWORD: "replace-with-a-strong-password"   # 务必改成强密码！
      MEILINK_FRPS_TOKEN: "replace-with-a-long-frp-token"        # frpc 连接 frps 的 token
      # ---- 客户端 bootstrap 拉取（推荐开启）----
      # 配置后，客户端 SetupView 只需填「管理页地址 + 这个 Token」即可自动拉取
      # frps 地址/端口/Token/子域名基域。留空则客户端需手动填写全部连接信息。
      MEILINK_DOMAIN_API_TOKEN: "replace-with-a-bootstrap-token"
      # ---- 可选：首次启动默认值（也可在管理页面改）----
      MEILINK_PRIMARY_DOMAIN: "tunnel.yourdomain.com"
      # MEILINK_FRPS_BIND_PORT: 7000      # 客户端连接端口
      # MEILINK_FRPS_HTTP_PORT: 8080      # HTTP vhost 端口
      # MEILINK_FRPS_HTTPS_PORT: 8443     # HTTPS vhost 端口
      # MEILINK_WEB_PORT: 17500           # 管理页端口
      # ---- 可选：frps 内置 dashboard 凭据（管理页「隧道状态」用它拉代理列表）----
      # 默认 admin/admin，仅容器内 127.0.0.1 访问，外部访问不到。如需更强隔离可改。
      # MEILINK_DASHBOARD_USER: admin
      # MEILINK_DASHBOARD_PASSWORD: admin
    volumes:
      - ./data:/data            # 持久化 frps 配置 + 域名目录
