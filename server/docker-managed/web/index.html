<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meilink Server</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13233d;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}.shell{max-width:1140px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e1e8f2;border-radius:16px;box-shadow:0 10px 30px #172b4d0d}.login{max-width:400px;margin:13vh auto;padding:28px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#246cf0,#79a9ff);color:#fff;font-weight:800;font-size:19px}.brand h1{font-size:22px;margin:0}.muted{color:#72829a;font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#60718b}.input,select{height:40px;border:1px solid #d8e2ef;border-radius:9px;padding:0 11px;font:inherit;color:#14243a;background:#fff}.input:focus,select:focus{outline:3px solid #2978f522;border-color:#2978f5}.button{border:0;border-radius:9px;background:#2877f5;color:#fff;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.button:hover{background:#1768e9}.button.secondary{background:#eaf2ff;color:#2560aa}.button.danger{background:#fff0f1;color:#bd3b48}.notice{min-height:18px;color:#c33d4c;font-size:13px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:17px 21px;margin-bottom:18px}.status{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#aab5c4}.dot.running{background:#27a96d;box-shadow:0 0 0 4px #27a91b1a}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px}.panel{padding:22px}.panel h2{font-size:18px;margin:0 0 4px}.panel h3{font-size:14px;margin:22px 0 8px}.ports{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.domain-head,.domain-row{display:grid;grid-template-columns:minmax(0,1fr) 116px 70px 38px;gap:8px;align-items:center}.domain-head{padding:8px 10px;color:#8190a4;font-size:11px;font-weight:700}.domain-row{padding:9px 10px;border-top:1px solid #edf1f6}.icon-button{width:34px;height:34px;padding:0;background:#fff0f1;color:#be3c49}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:20px}.logs{min-height:260px;max-height:520px;overflow:auto;border-radius:11px;background:#121d2e;padding:8px 12px;color:#dbe6f5;font:12px ui-monospace,Consolas,monospace}.log{padding:8px 0;border-bottom:1px solid #ffffff12}.log time{color:#91a4c0;margin-right:8px}.log.error{color:#ff9aa4}.guide{padding:13px;border:1px solid #dce8fb;border-radius:10px;background:#f4f8ff;color:#4f6685;font-size:13px;line-height:1.6}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.metric{padding:13px;border:1px solid #e4ebf4;border-radius:11px}.metric b{display:block;margin-top:4px;font-size:18px;color:#1a3559}@media(max-width:800px){.grid{grid-template-columns:1fr}.ports{grid-template-columns:1fr}.domain-head,.domain-row{grid-template-columns:1fr 94px 55px 34px}.topbar{align-items:flex-start;gap:13px;flex-direction:column}}
  </style>
</head>
<body>
  <main id="loginView" class="card login">
    <div class="brand"><div class="logo">M</div><div><h1>Meilink Server</h1><div class="muted">FRP 服务端管理</div></div></div>
    <form id="loginForm"><div class="field"><label>用户名</label><input id="user" class="input" required autocomplete="username"></div><div class="field"><label>密码</label><input id="password" class="input" type="password" required autocomplete="current-password"></div><p id="loginError" class="notice"></p><button class="button" style="width:100%">登录</button></form>
  </main>
  <main id="appView" class="shell hidden">
    <header class="card topbar"><div class="brand"><div class="logo">M</div><div><h1>Meilink Server</h1><div class="status"><i id="statusDot" class="dot"></i><span id="statusText">正在读取状态</span></div></div></div><div class="actions"><button id="restartFrps" class="button">重启 frps</button><button id="logout" class="button secondary">退出</button></div></header>
    <div class="grid"><section class="card panel"><h2>服务端配置</h2><div class="muted">保存后会写入 frps.toml 并重启 frps。</div>
      <form id="configForm"><div class="ports"><div class="field"><label>客户端连接端口</label><input class="input" name="bindPort" type="number" value="7000" required></div><div class="field"><label>HTTP 访问端口</label><input class="input" name="vhostHTTPPort" type="number" value="8080" required></div><div class="field"><label>HTTPS 访问端口</label><input class="input" name="vhostHTTPSPort" type="number" value="8443" required></div></div><p id="portNotice" class="notice"></p><div class="field"><label>FRP Token</label><input id="authToken" class="input" name="authToken" type="password" required placeholder="客户端连接此服务端所用 Token"></div>
        <h3>域名与泛域名</h3><div class="guide">frps 只支持一个主子域名基域；额外域名和 <code>*.example.com</code> 泛域名会保存在域名目录中，客户端创建 HTTP/HTTPS 隧道时填入“自定义域名”。请将每个域名及其泛解析 DNS 指向本服务器。</div><div class="domain-head"><span>域名</span><span>用途</span><span>启用</span><span></span></div><div id="domainRows"></div><div class="actions"><button id="addDomain" class="button secondary" type="button">+ 添加域名</button></div><div class="actions"><button class="button">保存并应用</button><span id="saveNotice" class="notice"></span></div></form>
    </section>
    <aside class="card panel"><h2>运行状态</h2><div class="summary"><div class="metric"><span class="muted">frps</span><b id="frpsState">-</b></div><div class="metric"><span class="muted">已配置域名</span><b id="domainCount">0</b></div></div><h3>运行日志</h3><div id="events" class="logs"></div><div class="actions"><button id="refresh" class="button secondary">刷新</button></div></aside></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
